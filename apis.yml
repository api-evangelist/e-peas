aid: e-peas
name: E-Peas
description: >-
  e-peas is a Belgian fabless semiconductor company founded in 2014 in
  Louvain-la-Neuve that designs power management integrated circuits (PMICs) for
  energy harvesting, enabling battery-free and battery-assisted IoT devices to
  power themselves from ambient energy. Its flagship Ambient Energy Manager (AEM)
  family harvests from photovoltaic (light), thermal, vibration/piezoelectric,
  radio-frequency, and hybrid multi-source inputs, and the company also develops
  ultra-low-power microcontrollers for autonomous data acquisition. e-peas
  positions itself as a pioneer of the "Ambient IoT" concept serving smart
  buildings, industrial IoT, consumer electronics, and wearables, with an
  ecosystem of 30+ partners including Panasonic, TDK, Vishay, and Silicon Labs.
  This is a hardware/silicon company that does not currently publish a public
  developer API, SDK, or API documentation.
